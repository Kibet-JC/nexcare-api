name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    # Integration tests run against a real Postgres (CLAUDE.md §4.2 — no mocks),
    # so CI spins up the same engine version we run locally and in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexcare
          POSTGRES_PASSWORD: nexcare
          POSTGRES_DB: nexcare_dev
        ports:
          - 5432:5432
        # Hold the job's steps until Postgres is accepting connections.
        options: >-
          --health-cmd "pg_isready -U nexcare -d nexcare_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Consumed by Prisma. The service is reachable on localhost because we map
    # its port to the runner above.
    env:
      DATABASE_URL: postgresql://nexcare:nexcare@localhost:5432/nexcare_dev?schema=public
      # Fixed dummy value (>= 32 chars) so env validation passes in CI. NOT a
      # real secret — production signs access tokens with the Railway-set value.
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      # No standalone `prisma migrate deploy` here: the Vitest globalSetup
      # (tests/setup/global-setup.ts) now provisions the isolated nexcare_test
      # database and applies the committed migrations to it, so the suite never
      # touches nexcare_dev. The Postgres service above still supplies the
      # server (the nexcare user can CREATE DATABASE).

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Verify the production compile on every PR: `pnpm build` runs the same
      # prisma generate + tsc -p tsconfig.build.json that the Docker image runs,
      # so a build that would break the Railway deploy is caught here, not at
      # deploy time.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
